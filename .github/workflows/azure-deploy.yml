name: Deploy AgeEstAI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - .github/workflows/azure-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ secrets.AZURE_CREDENTIALS != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          inlineScript: |
            az account set --subscription "$AZURE_SUBSCRIPTION_ID"
            az containerapp up \
              --name ageestai \
              --resource-group ageestai-rg \
              --location eastus \
              --environment ageestai-env \
              --source . \
              --ingress external \
              --target-port 8000 \
              --min-replicas 1 \
              --max-replicas 2

      - name: Show application URL
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp show \
              --name ageestai \
              --resource-group ageestai-rg \
              --query properties.configuration.ingress.fqdn \
              --output tsv
