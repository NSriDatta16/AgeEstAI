name: Build Publish and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/nsridatta16/ageestai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy public GHCR image to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp up \
              --name ageestai \
              --resource-group ageestai-rg \
              --location eastus \
              --environment ageestai-env \
              --image ghcr.io/nsridatta16/ageestai:latest \
              --ingress external \
              --target-port 8000 \
              --min-replicas 1 \
              --max-replicas 2
      - name: Get public URL
        uses: azure/cli@v2
        with:
          inlineScript: |
            echo "https://$(az containerapp show --name ageestai --resource-group ageestai-rg --query properties.configuration.ingress.fqdn --output tsv)"
